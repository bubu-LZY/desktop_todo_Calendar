name: Probe macos-15 dmg

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: 环境信息
        run: |
          echo "=== sw_vers ==="; sw_vers
          echo "=== hdiutil info ==="; hdiutil info | head -60 || true
          echo "=== df -h ==="; df -h
          echo "=== diskutil list ==="; diskutil list | head -40 || true
          echo "=== mounted disks ==="; mount | grep -i disk || true

      - name: 直接试最小 dmg（无文件）
        run: |
          mkdir -p /tmp/probe-empty
          hdiutil create -volname "Probe" -srcfolder /tmp/probe-empty -ov -format UDZO /tmp/probe-empty.dmg -verbose || echo "EMPTY_FAILED=$?"

      - name: 试带 HTML 的 dmg（绕开 Spotlight 文本打包，见 Apple rdar hdiutil Resource busy）
        run: |
          mkdir -p /tmp/probe-html
          dd if=/dev/urandom of=/tmp/probe-html/blob.bin bs=1m count=4
          hdiutil create -volname "Probe" -srcfolder /tmp/probe-html -ov -format UDZO /tmp/probe-html.dmg -verbose || echo "HTML_FAILED=$?"

      - name: 试 UDIF 不带压缩
        run: |
          mkdir -p /tmp/probe-udif
          dd if=/dev/urandom of=/tmp/probe-udif/blob.bin bs=1m count=4
          hdiutil create -volname "Probe" -srcfolder /tmp/probe-udif -ov -format UDIF /tmp/probe-udif.dmg -verbose || echo "UDIF_FAILED=$?"

      - name: 列表结果
        if: always()
        run: ls -la /tmp/*.dmg || true

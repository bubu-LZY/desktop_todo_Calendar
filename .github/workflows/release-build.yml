name: Build & Release (Windows)

# 本仓库当前只发布 Windows 安装包（WPF 宿主 MicaAgenda.App）。
# 推 v* 标签即自动构建安装包并创建 Release；也可以手动触发只构建、不发布。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '只构建时写入安装包的版本号（留空用 setup.iss 里的默认值）'
        required: false
        default: ''

permissions:
  contents: write           # 只用内置 GITHUB_TOKEN，不配置任何个人 secret

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 还原
        run: dotnet restore MicaAgenda.App/MicaAgenda.App.csproj

      - name: 单元测试
        run: dotnet test MicaAgenda.Tests -c Release

      - name: 发布（WPF 宿主，自包含 win-x64）
        run: >
          dotnet publish MicaAgenda.App/MicaAgenda.App.csproj -c Release
          -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o installer/publish

      - name: 打包（Inno Setup）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 定位 ISCC.exe：Program Files / Program Files (x86) / chocolatey 三处都找。
          # 注意 PowerShell 里 $env:ProgramFiles(x86) 是非法解析（$env:ProgramFiles + 字面量 (x86)），
          # 必须写成 ${env:ProgramFiles(x86)}，否则 32 位安装目录永远搜不到 → CI 报 ISCC not found。
          function Find-Iscc {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, 'C:\ProgramData\chocolatey')
            foreach ($root in $roots) {
              if (-not $root -or -not (Test-Path -LiteralPath $root)) { continue }
              $hit = Get-ChildItem -LiteralPath $root -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
              if ($hit) { return $hit }
            }
            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y --force
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'ISCC.exe not found' }
          Write-Output "ISCC: $iscc"

          $ver = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if (-not $ver) { $ver = '3.1.9' }

          # 中文语言文件：优先用编译器自带的；编译器不带中文时回退到随仓库携带的副本
          $langIsl = Join-Path (Split-Path $iscc) 'Languages\ChineseSimplified.isl'
          $langArg = if (Test-Path $langIsl) { "/DLangIsl=$langIsl" } else { '/DLangIsl=tools\ChineseSimplified.isl' }
          Write-Output "Language file: $langArg"

          & $iscc $langArg "/DMyAppVersion=$ver" setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          Get-ChildItem installer\*.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: installer/*.exe

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # 手动触发时不发布，只构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 生成源码 zip
        run: |
          VER="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="desktop_todo_Calendar-${VER}/" \
            -o "desktop_todo_Calendar-Source-${VER}.zip" "refs/tags/${GITHUB_REF_NAME}"

      - name: 生成发布说明（截取 CHANGELOG 对应版本段）
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v hdr="## v${VER}" '
            index($0,hdr)==1 {p=1}
            p && /^## v/ && index($0,hdr)!=1 {exit}
            p {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "# ${GITHUB_REF_NAME}" > release-notes.md
          echo "----- release notes -----"; cat release-notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # download-artifact 会保留子目录，只收集文件（把目录当资产会报 "is a directory"）
          mapfile -t ASSETS < <(find release-assets -type f)
          while IFS= read -r -d '' z; do ASSETS+=("$z"); done < <(find . -maxdepth 1 -name 'desktop_todo_Calendar-Source-*.zip' -print0)
          if [ ${#ASSETS[@]} -eq 0 ]; then echo "ERROR: 未收集到任何产物"; exit 1; fi
          echo "将上传 ${#ASSETS[@]} 个资产："; printf '  %s\n' "${ASSETS[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber      # 幂等：已存在则覆盖本次产物
            gh release edit "$TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes-file release-notes.md --latest
          fi

      - name: 核对发布结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag:.tagName,draft:.isDraft,pre:.isPrerelease,assets:[.assets[]|{name,size}]}'
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 手动触发做「只构建不发布」的干跑验证

permissions:
  contents: write           # 只用内置 GITHUB_TOKEN，不配置任何个人 secret

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # 一路失败不影响其他平台产出，便于排查
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            rid: win-x64
            pkg: windows
          - label: macos-x64
            os: macos-15-intel
            rid: osx-x64
            pkg: macos
          - label: macos-arm64
            os: macos-15
            rid: osx-arm64
            pkg: macos
          - label: linux-x64
            os: ubuntu-22.04
            rid: linux-x64
            pkg: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 还原
        run: dotnet restore MicaAgenda.sln

      - name: 测试（跨平台单测）
        run: dotnet test MicaAgenda.Tests -c Release --no-restore

      - name: 发布（${{ matrix.rid }}）
        run: >
          dotnet publish MicaAgenda.Desktop -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=false
          -o pkg

      - name: 打包（Windows / Inno Setup）
        if: matrix.pkg == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver setup.iss

      - name: 打包（macOS / .app + dmg + zip）
        if: matrix.pkg == 'macos'
        run: bash tools/package-macos.sh "${{ matrix.rid }}" "${GITHUB_REF_NAME#v}"

      - name: 打包（Linux / AppImage + deb）
        if: matrix.pkg == 'linux'
        run: bash tools/package-linux.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: |
            installer/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # 手动触发时不发布，只构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 生成源码 zip
        run: bash tools/make-source-zip.sh "${GITHUB_REF_NAME#v}"

      - name: 生成发布说明（截取 CHANGELOG 对应版本段）
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v hdr="## v${VER}" '
            index($0,hdr)==1 {p=1}
            p && /^## v/ && index($0,hdr)!=1 {exit}
            p {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "# ${GITHUB_REF_NAME}" > release-notes.md
          echo "----- release notes -----"; cat release-notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 只收集文件：download-artifact 会保留 installer/ dist/ 子目录，直接把目录当资产会报 "is a directory"
          mapfile -t ASSETS < <(find release-assets -type f)
          while IFS= read -r -d '' z; do ASSETS+=("$z"); done < <(find . -maxdepth 1 -name '*-Source-*.zip' -print0)
          if [ ${#ASSETS[@]} -eq 0 ]; then echo "ERROR: 未收集到任何产物"; exit 1; fi
          echo "将上传 ${#ASSETS[@]} 个资产："; printf '  %s\n' "${ASSETS[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber      # 幂等：已存在则覆盖本次产物
            gh release edit "$TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes-file release-notes.md --latest
          fi

      - name: 核对发布结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag:.tagName,draft:.isDraft,pre:.isPrerelease,assets:[.assets[]|{name,size}]}'
